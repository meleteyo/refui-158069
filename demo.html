<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>화면 시안 데모 — 시니어 방문재활 매칭</title>
<meta property="og:title" content="화면 시안 데모 — 시니어 방문재활 매칭">
<meta property="og:description" content="고객 신청부터 대표님의 선생님 배정까지, 직접 눌러보실 수 있는 화면 시안입니다.">
<style>
:root{
  --ink:#16262c; --ink-2:#3d5058; --ink-3:#6b7f88;
  --brand:#0f6d63; --brand-2:#0b544c; --brand-soft:#e8f4f2; --brand-line:#bfdcd7;
  --accent:#b45f2b; --accent-soft:#fdf1e8;
  --bg:#ffffff; --bg-soft:#f6f9f8; --line:#dde5e3;
  --s-apply-bg:#eef1f2; --s-apply-fg:#5b6b73;
  --s-confirm-bg:#e7f0fb; --s-confirm-fg:#1f5fa8;
  --s-assign-bg:#e6f5ec; --s-assign-fg:#1a7f4b;
  --s-contract-bg:#d8efe2; --s-contract-fg:#0f5c39;
  --s-cancel-bg:#fbeceb; --s-cancel-fg:#a8392c;
  --s-alert-bg:#fdf0e3; --s-alert-fg:#a2601f;
  --radius:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-soft);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.65;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;letter-spacing:-0.02em}
[hidden]{display:none !important}

/* ===== 상단 바 ===== */
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.notice{background:var(--accent-soft);color:#8a4a20;font-size:.8rem;padding:6px 14px;text-align:center;border-bottom:1px solid #f2ddcc}
.notice b{font-weight:800}
.bar{display:flex;align-items:center;gap:10px;padding:9px 14px;flex-wrap:wrap}
.bar .ttl{font-weight:800;font-size:.95rem;margin-right:auto}
.bar .ttl span{font-weight:500;color:var(--ink-3);font-size:.82rem}
.modes{display:flex;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:700;color:var(--ink-3)}
.modes button[aria-pressed="true"]{background:var(--brand);color:#fff}
.ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:.82rem;color:var(--ink-2)}
.ghost:hover{border-color:var(--brand-line)}

/* ===== 레이아웃 ===== */
/* minmax(0,1fr): 안쪽 표가 넓어도 컬럼이 늘어나지 않게 — 늘어나면 페이지 전체가 가로로 넘친다 */
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 60px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.wrap > *{min-width:0}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* 가이드 레일 */
.guide{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:.88rem;color:var(--brand-2);display:flex;gap:10px;align-items:flex-start}
.guide .step{background:var(--brand);color:#fff;border-radius:6px;padding:1px 8px;font-size:.76rem;font-weight:800;white-space:nowrap}

/* 폰 프레임 */
.phone{max-width:390px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 24px rgba(20,45,50,.07)}
.phone .nav{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff;font-size:.9rem;font-weight:700}
.phone .nav .back{border:0;background:transparent;color:var(--ink-3);padding:0 4px 0 0;font-size:1rem}
.phone .nav .cnt{margin-left:auto;color:var(--ink-3);font-weight:600;font-size:.82rem}
.scr{padding:18px 16px 22px}

/* 공통 요소 */
.h-lg{font-size:1.28rem;margin-bottom:8px}
.h-md{font-size:1.05rem;margin-bottom:6px}
.sub{color:var(--ink-2);font-size:.9rem;margin:0 0 14px}
.muted{color:var(--ink-3);font-size:.82rem}
.field{margin-bottom:16px}
.field > label{display:block;font-weight:700;font-size:.9rem;margin-bottom:7px}
.req{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:.86rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2);font-weight:700}
select,input[type=text],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff}
select:focus,input:focus,textarea:focus{outline:2px solid var(--brand-line);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:13px;font-weight:800;font-size:.98rem}
.btn:disabled{background:#c6d3d1;color:#fff}
.btn.sec{background:#fff;color:var(--brand-2);border:1px solid var(--brand-line)}
.btn.warn{background:var(--accent)}
.agree{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:16px 0}
.agree label{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;margin:9px 0;color:var(--ink-2)}
.agree input{margin-top:3px;width:17px;height:17px;flex:0 0 auto}
.agree .view{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-size:.8rem;text-decoration:underline}
.result-icon{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:1.7rem;margin:6px auto 12px}
.price{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin:16px 0}
.price .r{display:flex;justify-content:space-between;margin:5px 0;font-size:.92rem;color:var(--ink-2)}
.price .r b{color:var(--ink);font-size:1.05rem}
.pay-mock{border:2px dashed var(--accent);border-radius:12px;padding:16px;background:var(--accent-soft);margin-bottom:14px}
.pay-mock .tag{display:inline-block;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;border-radius:5px;padding:2px 8px;margin-bottom:8px}

/* ⓘ 규칙 툴팁 */
.why{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--brand-line);background:#fff;color:var(--brand);font-size:.72rem;font-weight:800;margin-left:5px;vertical-align:middle;padding:0}
.why:hover{background:var(--brand-soft)}

/* ===== 관리자 ===== */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel .head{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .head h3{font-size:1rem;margin-right:auto}
.panel .body{padding:15px}
.admnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.admnav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:.85rem;color:var(--ink-2)}
.admnav button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.filters select{width:auto;min-width:110px;padding:7px 9px}
.counts{font-size:.85rem;color:var(--ink-2);padding:9px 15px;background:var(--bg-soft);border-bottom:1px solid var(--line)}
.counts b{color:var(--ink)}
.counts .alert{color:var(--s-alert-fg);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:middle}
th{background:var(--bg-soft);font-weight:700;color:var(--ink-2);font-size:.8rem;white-space:nowrap}
tbody tr:hover{background:#fafcfb}
tbody tr.isnew{background:#fffaf3}
.lnk{border:0;background:transparent;color:var(--brand-2);font-weight:700;text-decoration:underline;padding:0}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.s-신청{background:var(--s-apply-bg);color:var(--s-apply-fg)}
.s-확인{background:var(--s-confirm-bg);color:var(--s-confirm-fg)}
.s-배정{background:var(--s-assign-bg);color:var(--s-assign-fg)}
.s-계약{background:var(--s-contract-bg);color:var(--s-contract-fg)}
.s-취소{background:var(--s-cancel-bg);color:var(--s-cancel-fg)}
.dot{color:var(--s-alert-fg);font-weight:900;margin-left:5px}
.tag-new{background:var(--accent);color:#fff;border-radius:5px;font-size:.7rem;font-weight:800;padding:1px 6px;margin-left:6px}
.sec-block{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:12px}
.sec-block h4{font-size:.9rem;margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec-block h4 .right{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.87rem}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink)}
.masked{background:var(--bg-soft);border:1px dashed var(--line);border-radius:9px;padding:14px;text-align:center;color:var(--ink-3);font-size:.87rem}
.hist{border-top:1px dashed var(--line);margin-top:9px;padding-top:9px;font-size:.82rem;color:var(--ink-3)}
.hist div{margin:3px 0}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:.83rem;font-weight:700;color:var(--brand-2)}
.mini:disabled{color:var(--ink-3);background:var(--bg-soft);border-color:var(--line);cursor:not-allowed;font-weight:500}
.mini.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.mini.pri:disabled{background:#c6d3d1;border-color:#c6d3d1;color:#fff}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok{color:var(--s-assign-fg);font-weight:700}
.no{color:var(--s-alert-fg);font-weight:700}

/* 알림 패널 */
.side{position:sticky;top:96px}
.notify{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.notify .nh{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:7px}
.notify .nb{max-height:60vh;overflow-y:auto}
.nitem{padding:11px 14px;border-bottom:1px solid var(--line);font-size:.82rem}
.nitem:last-child{border-bottom:0}
.nitem .to{font-weight:700;color:var(--brand-2);font-size:.8rem}
.nitem .ch{background:var(--bg-soft);border-radius:5px;padding:1px 6px;font-size:.72rem;color:var(--ink-3);margin-left:5px}
.nitem .msg{color:var(--ink-2);margin-top:3px;line-height:1.5}
.nempty{padding:22px 14px;text-align:center;color:var(--ink-3);font-size:.84rem}

/* 모달·토스트 */
.mask{position:fixed;inset:0;background:rgba(15,35,40,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:20px;max-height:86vh;overflow-y:auto}
.modal h3{font-size:1.05rem;margin-bottom:10px}
.modal p{font-size:.9rem;color:var(--ink-2);margin:8px 0}
.modal .acts{display:flex;gap:8px;margin-top:16px}
.modal .acts .btn{flex:1}
.unmet{background:var(--s-alert-bg);border-radius:9px;padding:11px 13px;margin:10px 0;font-size:.87rem;color:#7d4a13}
.unmet li{margin:3px 0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16262c;color:#fff;border-radius:10px;
  padding:11px 17px;font-size:.87rem;z-index:200;max-width:88vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.optbar{background:#f4f1fa;border:1px dashed #c4b6de;color:#5b4a86;border-radius:9px;padding:9px 12px;font-size:.83rem;margin-bottom:12px;font-weight:600}
/* 광고 피드 */
.feed{background:#f2f4f5;border-radius:16px;padding:12px}
.feed .fh{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-3);padding:2px 4px 10px}
.ad{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px;text-align:left;width:100%;padding:0;display:block}
.ad:hover{border-color:var(--brand-line)}
.ad .adtop{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:.8rem}
.ad .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem}
.ad .spon{margin-left:auto;color:var(--ink-3);font-size:.72rem}
.ad .adimg{height:112px;display:flex;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;color:#fff;text-align:center;padding:0 16px;line-height:1.45}
.ad .adbody{padding:10px 11px 12px}
.ad .adbody b{display:block;font-size:.92rem;margin-bottom:3px;color:var(--ink)}
.ad .adbody span{font-size:.83rem;color:var(--ink-2)}
.ad .cta{display:inline-block;margin-top:8px;background:var(--brand-soft);color:var(--brand-2);border-radius:7px;padding:5px 12px;font-size:.8rem;font-weight:700}
.utmbar{background:var(--bg-soft);border:1px dashed var(--brand-line);border-radius:8px;padding:7px 10px;font-size:.78rem;color:var(--ink-3);margin-bottom:13px}
.utmbar b{color:var(--brand-2)}
.bars{margin-top:6px}
.barrow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:.85rem}
.barrow .lb{width:88px;flex:0 0 auto;color:var(--ink-2)}
.barrow .track{flex:1;background:var(--bg-soft);border-radius:5px;height:22px;position:relative;overflow:hidden}
.barrow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:5px}
.barrow .fill.b2{background:#5b8f86}
.barrow .fill.b3{background:var(--accent)}
.barrow .vl{width:74px;flex:0 0 auto;text-align:right;font-weight:700}
.pc-hint{display:none}
/* 관리자 표는 원래 PC용 화면 — 좁은 화면에서는 표만 가로로 넘겨 봅니다 */
@media (max-width:760px){
  .panel table{display:block;width:100%;max-width:100%;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .panel table th,.panel table td{white-space:nowrap}
  .pc-hint{display:block;background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;font-size:.8rem;color:var(--ink-3);margin-bottom:10px}
  .bar{gap:7px}
  .bar .ttl{width:100%;margin-bottom:2px}
}
.opt-badge{background:#ede7f8;color:#5b4a86;border:1px solid #c4b6de}
</style>
</head>
<body>

<header id="topbar">
  <div class="notice">
    <b>화면 흐름을 확인하기 위한 시안입니다.</b> 실제 결제·문자 발송은 일어나지 않으며, 입력하신 내용은 이 브라우저에만 저장됩니다.
  </div>
  <div class="bar">
    <div class="ttl">시니어 방문재활 매칭 <span>· 화면 시안 데모</span></div>
    <div class="modes" role="group" aria-label="화면 전환">
      <button id="mCust" aria-pressed="true" onclick="setMode('customer')">고객 화면</button>
      <button id="mAdm" aria-pressed="false" onclick="setMode('admin')">대표님 화면</button>
    </div>
    <button class="ghost" onclick="toggleGuide()" id="guideBtn">가이드 끄기</button>
    <button class="ghost" onclick="resetAll()">처음부터 다시</button>
  </div>
</header>

<div class="wrap">
  <div>
    <div class="guide" id="guideBar"></div>

    <!-- ============ 고객 화면 ============ -->
    <div id="customerMode">
      <div class="phone">
        <div class="nav" id="cNav"></div>
        <div class="scr" id="cScr"></div>
      </div>
    </div>

    <!-- ============ 관리자 화면 ============ -->
    <div id="adminMode" hidden>
      <div class="admnav">
        <button id="tabAds" onclick="goAdmin('ads')" aria-pressed="false">광고 성과</button>
        <button id="tabList" onclick="goAdmin('list')" aria-pressed="true">신청 관리</button>
        <button id="tabPay" onclick="goAdmin('pay')" aria-pressed="false">결제·환불 관리</button>
        <button id="tabTeacher" onclick="goAdmin('teacher')" aria-pressed="false">선생님 관리</button>
        <button id="tabOpt" onclick="goAdmin('opt')" aria-pressed="false">옵션 기능 미리보기</button>
      </div>
      <div id="aScr"></div>
    </div>
  </div>

  <aside class="side">
    <div class="notify">
      <div class="nh">발송된 알림 <span class="muted" style="font-weight:500">(실제 발송 아님)</span></div>
      <div class="nb" id="notifyList"></div>
    </div>
  </aside>
</div>

<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script>
"use strict";

/* ========== 코드 데이터 (모델 118 코드 정의서) ========== */
var CODE = {
  disease: ["뇌졸중","관절염","파킨슨병","척추질환","골절 후 회복","근감소증"],
  purpose: ["보행 능력 회복","근력 강화","균형·낙상 예방","일상동작 회복","통증 완화"],
  mobility: ["혼자 가능","부축하면 가능","보조기구 사용","전혀 불가"],
  area: ["서울 강동구","서울 송파구","서울 광진구","서울 성동구","서울 강남구","서울 노원구"],
  time: ["평일 오전","평일 오후","주말 오전","주말 오후"]
};
var PRODUCT = { name:"시스루 12주 과정", price:1680000, deposit:168000 };

/* 광고 캠페인 — 소재별 랜딩과 UTM이 다르게 붙는다 (공고 기능 1·12·13) */
var ADS = [
  { key:"A", media:"인스타그램", label:"부모님 재활 · 감성 소재",
    head:"퇴원하고 집에 오신 뒤,<br>재활은 어떻게 하고 계신가요?",
    body:"물리치료사·운동처방사가 집으로 찾아갑니다", grad:"linear-gradient(135deg,#0f6d63,#3a9c8f)",
    utm:{source:"meta",medium:"cpc",campaign:"senior_rehab_0901",content:"emotional_a",landing:"A"},
    landing:{ title:"부모님 재활,<br>집으로 찾아갑니다",
      sub:"병원 재활이 끝난 뒤가 더 중요합니다. 선생님이 댁으로 방문해 12주 동안 함께합니다." } },
  { key:"B", media:"네이버", label:"퇴원 후 공백 · 정보 소재",
    head:"입원 재활은 6개월이면 끝납니다.<br>그 다음은요?",
    body:"집에서 이어가는 12주 방문재활 프로그램", grad:"linear-gradient(135deg,#1f5fa8,#4a86c9)",
    utm:{source:"naver",medium:"cpc",campaign:"rehab_gap_0901",content:"info_b",landing:"B"},
    landing:{ title:"입원 재활 뒤의 공백,<br>집에서 채웁니다",
      sub:"제도권 집중 재활은 최대 6개월입니다. 그 뒤 자택 재활을 12주 과정으로 이어갑니다." } }
];
var DIRECT_UTM = {source:"direct",medium:"none",campaign:"-",content:"-",landing:"-"};

function mkApp(id,no,g,area,status,pay,at,dis,pur,mob,tm,sn,sa,teacherNo,started){
  return { id:id, no:no, guardian:g, phone:"010-****-**"+(1000+id).toString().slice(1,3), area:area,
    status:status, pay:pay, createdAt:at, disease:dis, purpose:pur, mobility:mob, times:tm,
    seniorName:sn, seniorAge:sa, teacherNo:teacherNo||null, assignedAt:teacherNo?at+2*3600000:null,
    started:!!started, orderNo:"HR"+fmtOrder(at)+"-"+(100000+id).toString().slice(1),
    paidAt: pay==="성공"||pay==="환불완료" ? at+12*60000 : null,
    payConfirmedBy: status==="계약"||status==="배정" ? "대표" : null,
    payConfirmedAt: status==="계약"||status==="배정" ? at+3*3600000 : null,
    utm:(id%2 ? {source:"meta",medium:"cpc",campaign:"senior_rehab_0901",content:"emotional_a",landing:"A"}
              : {source:"naver",medium:"cpc",campaign:"rehab_gap_0901",content:"info_b",landing:"B"}),
    memos: status==="신청"?[]:[{by:"대표",at:at+3*3600000,text:"통화 완료. 방문 희망 시간 확인함."}],
    history: buildHist(status, at), isNew:false };
}
function buildHist(status, at){
  var H=3600000, order=["신청","확인","배정","계약"], h=[], prev="신청";
  if(status==="취소"){ return [{from:"신청",to:"취소",by:"대표",at:at+30*H}]; }
  var idx = order.indexOf(status);
  for(var i=1;i<=idx;i++){ h.push({from:order[i-1],to:order[i],by:"대표",at:at+(i*3)*H}); }
  return h;
}
function fmtOrder(ts){ var d=new Date(ts); return ""+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate()); }
function p2(n){ return (n<10?"0":"")+n; }

function save(){ if(memoryOnly) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ memoryOnly=true; } }
function load(){
  try{ var raw = localStorage.getItem(LS_KEY); if(raw){ return JSON.parse(raw); } }
  catch(e){ memoryOnly = true; }
  return null;
}
function resetAll(){
  S = seed(); try{ localStorage.removeItem(LS_KEY); }catch(e){}
  save(); renderAll(); toast("처음 상태로 되돌렸습니다.");
}

/* ========== 유틸 ========== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function won(n){ return n.toLocaleString("ko-KR"); }
function fmtDT(ts){ var d=new Date(ts); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes()); }
function fmtMD(ts){ var d=new Date(ts); return p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes()); }
function elapsed(ts){ var h=Math.floor((Date.now()-ts)/3600000); return h<1?"방금":(h<24?h+"시간":Math.floor(h/24)+"일"); }
function isUnconfirmed(a){ return a.status==="신청" && (Date.now()-a.createdAt)/3600000 >= 2; }
var toastTimer=null;
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.hidden=false;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.hidden=true; }, 3200);
}
function notify(to, channel, msg){
  S.notify.unshift({to:to, ch:channel, msg:msg, at:Date.now()});
  renderNotify(); save();
}

// MG1003: 전이 가능한 상태만. '확인'은 결제 성공 전제, '배정'은 유효 배정 존재
function transitions(a){
  if(a.status==="취소"||a.status==="계약") return [];
  var out=[];
  if(a.status==="신청"){ if(a.pay==="성공") out.push("확인"); }
  if(a.status==="확인"){ if(a.teacherNo) out.push("배정"); }
  if(a.status==="배정"){ out.push("계약"); }
  out.push("취소");
  return out;
}
// MG1005: 지역·시간·담당수는 사유 입력으로 배정 가능, 재직 아니면 후보에서 제외
function evalTeacher(t, app){
  var unmet=[];
  if(t.areas.indexOf(app.area)<0) unmet.push("활동 지역에 고객의 거주 지역이 포함되지 않습니다");
  var overlap = app.times.some(function(x){ return t.times.indexOf(x)>=0; });
  if(app.times.length && !overlap) unmet.push("가용 시간이 희망 시간과 겹치지 않습니다");
  if(t.cur >= t.max) unmet.push("담당 고객 수가 상한에 도달했습니다");
  return unmet;
}

function reveal(id){ S.revealed[id]=true; save(); renderAdmin(); toast("건강정보 열람 기록이 남았습니다. (열람자: 대표 · "+fmtDT(Date.now())+")"); }

function addMemo(id){
  var box=$("memoBox"), v=box?box.value.trim():"";

  app(id).memos.unshift({by:"대표",at:Date.now(),text:v}); save(); renderAdmin(); toast("메모를 저장했습니다.");
}
function changeStatus(id){
  var a=app(id), to=$("toStatus").value, reason=($("stReason").value||"").trim();
  if(to==="취소" && !reason){ toast("취소하실 때는 사유를 적어주세요."); return; }
  a.history.unshift({from:a.status,to:to,by:"대표",at:Date.now()});
  a.status=to;
  if(to==="취소"){
    if(a.teacherNo){ var t=S.teachers.filter(function(x){return x.no===a.teacherNo;})[0]; if(t&&t.cur>0) t.cur--;
      notify("선생님("+t.name+"님)","알림톡","배정이 해제되었습니다. 신청 "+a.no); a.teacherNo=null; }
    if(a.pay==="성공"){ a.pay="환불완료"; notify("고객("+a.guardian+"님)","SMS","[시스루] 환불이 완료되었습니다. "+won(PRODUCT.deposit)+"원"); }
  }
  if(to==="계약"){ a.started=true; }
  save(); renderAdmin(); toast("상태를 '"+to+"'(으)로 변경했습니다.");
}

function shortUnmet(s){
  if(s.indexOf("지역")>=0) return "지역 불일치";
  if(s.indexOf("시간")>=0) return "시간 불일치";
  return "담당수 초과";
}
var pickedTeacher=null;
function selTeacher(no){ pickedTeacher=no; }
function doAssign(id){
  var a=app(id);
  if(!pickedTeacher){ toast("배정할 선생님을 선택해 주세요."); return; }
  if(a.status!=="확인" && !a.teacherNo){ toast("상태가 '확인'이어야 배정할 수 있습니다."); return; }
  var t=S.teachers.filter(function(x){return x.no===pickedTeacher;})[0];
  var unmet=evalTeacher(t,a);
  if(unmet.length){
    modal('<h3>배정 조건 확인</h3><p><b>'+esc(t.name)+'</b> 선생님은 아래 조건을 충족하지 않습니다.</p>'+
      '<ul class="unmet">'+unmet.map(function(u){ return '<li>· '+esc(u)+'</li>'; }).join("")+'</ul>'+
      '<p class="muted">그래도 배정하시려면 사유를 적어주세요. 기록으로 남습니다.</p>'+
      '<input type="text" id="assignReason" placeholder="예: 고객이 이 선생님을 요청함" style="width:100%;margin-top:6px">'+
      '<div class="acts"><button class="btn sec" onclick="closeModal()">취소</button>'+
      '<button class="btn warn" onclick="finishAssign('+id+','+t.no+',true)">배정 진행</button></div>');
    return;
  }
  finishAssign(id,t.no,false);
}
function finishAssign(id,tno,needReason){
  var a=app(id), t=S.teachers.filter(function(x){return x.no===tno;})[0];
  if(needReason){
    var r=$("assignReason"); var v=r?r.value.trim():"";
    if(!v){ toast("배정 사유를 적어주세요."); return; }
    a.memos.unshift({by:"대표",at:Date.now(),text:"조건 미충족 배정 사유: "+v});
    closeModal();
  }
  if(a.teacherNo){
    var old=S.teachers.filter(function(x){return x.no===a.teacherNo;})[0];
    if(old&&old.cur>0) old.cur--;
    notify("선생님("+old.name+"님)","알림톡","배정이 해제되었습니다. 신청 "+a.no);
  }
  a.teacherNo=t.no; a.assignedAt=Date.now(); t.cur++;
  if(a.status==="확인"){ a.history.unshift({from:"확인",to:"배정",by:"대표",at:Date.now()}); a.status="배정"; }
  save();
  notify("선생님("+t.name+"님)","알림톡","새 고객이 배정되었습니다. "+a.area+" · 신청 "+a.no);
  notify("고객("+a.guardian+"님)","SMS","[시스루] 담당 선생님이 배정되었습니다. "+t.name+" 선생님이 곧 연락드립니다.");
  S.aScreen="detail"; renderGuide(); renderAdmin(); toast(t.name+" 선생님을 배정했습니다.");
}

    '<p class="muted">결제 후 '+days+'일 경과 · 서비스 '+(a.started?"개시함":"미개시")+'</p>'+
    '<div class="unmet" style="background:var(--brand-soft);color:var(--brand-2)">'+
      (full?'전액 환불 대상입니다 (7일 이내 · 서비스 미개시)':'서비스가 시작되었거나 7일이 지나 <b>공제 금액을 입력</b>해야 합니다')+'</div>'+
    (full?'':'<input type="text" id="deduct" placeholder="공제 금액 (원)" style="width:100%">')+
    '<div class="acts"><button class="btn sec" onclick="closeModal()">닫기</button>'+
    '<button class="btn" onclick="doRefund('+id+','+full+')">환불 실행</button></div>');
}
function doRefund(id, full){
  var a=app(id);
  a.pay="환불완료";
  a.history.unshift({from:a.status,to:"취소",by:"대표",at:Date.now()});
  a.status="취소";
  if(a.teacherNo){ var t=S.teachers.filter(function(x){return x.no===a.teacherNo;})[0];
    if(t&&t.cur>0) t.cur--; notify("선생님("+t.name+"님)","알림톡","배정이 해제되었습니다. 신청 "+a.no); a.teacherNo=null; }
  save(); closeModal(); renderAdmin();
  notify("고객("+a.guardian+"님)","SMS","[시스루] 환불이 완료되었습니다. 문의는 고객센터로 연락 주세요.");
  toast("환불 처리했습니다. 신청은 '취소' 상태가 됩니다.");
}
function viewTeacher(){
  var rows=S.teachers.map(function(t){
    return '<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.qual)+'</td>'+
      '<td>'+esc(t.areas.map(function(x){return x.replace("서울 ","");}).join(", "))+'</td>'+
      '<td>'+esc(t.times.join(", "))+'</td><td>'+t.cur+' / '+t.max+'</td>'+
      '<td>'+(t.active?'<span class="ok">재직</span>':'<span class="muted">퇴직</span>')+'</td>'+
      '<td><button class="mini" onclick="toggleTeacher('+t.no+')">'+(t.active?"퇴직 처리":"재직 복귀")+'</button></td></tr>';
  }).join("");
  return '<div class="panel"><div class="head"><h3>선생님 관리</h3></div>'+
    '<table><thead><tr><th>성명</th><th>자격</th><th>활동 지역</th><th>가용 시간</th><th>담당/상한</th><th>재직</th><th>처리</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="body"><p class="muted" style="margin:0">퇴직 처리해도 지난 배정 기록은 남습니다. 퇴직하신 분은 배정 화면 후보에서 사라집니다 — 직접 바꿔보시고 배정 화면을 확인해 보세요.</p></div></div>';
}
function toggleTeacher(no){
  var t=S.teachers.filter(function(x){return x.no===no;})[0];
  t.active=!t.active; save(); renderAdmin();
  toast(t.name+" 선생님을 "+(t.active?"재직":"퇴직")+" 처리했습니다.");
}
function viewOpt(){
  var a=S.apps.filter(function(x){return x.status==="배정"||x.status==="계약";})[0]||S.apps[0];
  return '<div class="optbar">아래 세 화면은 <b>옵션 기능</b>입니다 — 필수 범위 견적(2,200만원)에 포함되지 않으며 별도 견적입니다.</div>'+
    '<div class="panel" style="margin-bottom:14px"><div class="head"><h3>가족 대시보드</h3><span class="badge opt-badge">옵션 · 100만~150만원</span></div>'+
    '<div class="body"><p class="muted" style="margin-top:0">결제하신 자녀분이 진행 상황을 확인하는 화면입니다.</p>'+
      '<dl class="kv"><dt>담당 선생님</dt><dd>박지훈 (물리치료사)</dd><dt>진행</dt><dd>12주 중 <b>3주차</b> · 남은 회차 18회</dd>'+
      '<dt>다음 방문</dt><dd>9월 12일 (목) 오전 10시</dd><dt>지금 해지하시면</dt><dd>예상 환불액 <b>1,344,000원</b> <span class="muted">(이용 6회 공제 · 위약금 별도 안내)</span></dd></dl>'+
      '<p class="muted" style="margin-bottom:0">남은 회차와 예상 환불액을 미리 보여드리면 환불 문의와 분쟁이 크게 줄어듭니다.</p></div></div>'+

    '<div class="panel" style="margin-bottom:14px"><div class="head"><h3>방문 활동 보고</h3><span class="badge opt-badge">옵션 · 별도 산정</span></div>'+
    '<div class="body"><p class="muted" style="margin-top:0">선생님이 방문 때마다 남기고, 자녀분이 확인합니다.</p>'+
      '<div class="sec-block" style="margin-bottom:0"><h4>9월 5일 · 6회차 · 박지훈 선생님</h4>'+
      '<dl class="kv"><dt>목표</dt><dd>보행 지구력 향상</dd><dt>수행</dt><dd>보행 훈련 20분, 하지 근력 15분</dd>'+
      '<dt>수행 정도</dt><dd>계획의 90%</dd><dt>관찰</dt><dd>지난주보다 5분 더 걸으심. 왼쪽 무릎 통증 호소 없음</dd></dl>'+
      '<p class="muted" style="margin-bottom:0">촬영 동의를 받은 사진·영상도 함께 올릴 수 있습니다</p></div></div></div>'+

    '<div class="panel"><div class="head"><h3>7일 수행체크</h3><span class="badge opt-badge">옵션 · 100만~150만원</span></div>'+
    '<div class="body"><p class="muted" style="margin-top:0">선생님이 오지 않는 날의 자가운동을 기록합니다. 기록은 선생님·가족이 남깁니다.</p>'+
      '<div class="inline">'+["월","화","수","목","금","토","일"].map(function(d,i){
        return '<span class="badge '+(i<4?"s-배정":"s-신청")+'">'+d+(i<4?" ✓":" ·")+'</span>'; }).join("")+'</div>'+
      '<p class="muted" style="margin-bottom:0">방문 회차 기록은 환불 계산의 근거가 되기 때문에, 이 기능은 필수 범위로 올리기를 권해드립니다.</p></div></div>';
}

/* ========== 모달 ========== */
function modal(html){ $("modalRoot").innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }
function closeModal(){ $("modalRoot").innerHTML=""; }

/* ========== 시작 ========== */
(function init(){
  var loaded = load();
  S = loaded || seed();
  if(!S.apps || !S.teachers){ S = seed(); }
  renderAll();
  if(!S.seenIntro){
    S.seenIntro=true; save();
    modal('<h3>계약 1주차에 드릴 화면 시안입니다</h3>'+
      '<p>제안서에 적은 <b>"1주차에 클릭 가능한 화면 시안"</b>이 어떤 것인지 미리 보시라고 준비했습니다.</p>'+
      '<p><b>이렇게 보시면 됩니다.</b> 광고를 눌러 들어와 신청하고 결제해 보신 뒤, 위쪽에서 <b>대표님 화면</b>으로 바꿔보세요. 방금 넣으신 신청이 목록에 그대로 올라와 있고, <b>광고 성과</b> 화면에서는 그 광고의 숫자가 올라가 있습니다.</p>'+
      '<p class="muted">실제 결제나 문자 발송은 일어나지 않습니다. 실제 개발에서는 이 화면 뒤에 서버·결제 연동·보안이 붙습니다.</p>'+
      '<div class="acts"><button class="btn" onclick="closeModal()">시작하기</button></div>');
  }
  if(memoryOnly){ toast("이 브라우저에서는 저장이 제한되어, 새로고침하면 처음부터 시작됩니다."); }
})();
</script>
